name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Check CLI help
        run: python sdr_agent.py --help

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download and verify Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location --output "$archive" "$release/$archive"
          curl --fail --silent --show-error --location --output "$checksums" "$release/$checksums"
          awk -v archive="$archive" '$2 == archive { print; found = 1 } END { if (!found) exit 1 }' "$checksums" | sha256sum --check --strict
          mkdir -p gitleaks-bin
          tar -xzf "$archive" -C gitleaks-bin gitleaks
          echo "$RUNNER_TEMP/gitleaks-bin" >> "$GITHUB_PATH"
      - name: Scan full Git history
        run: gitleaks git --redact --verbose --exit-code 1 .
